# Dependabot config with cooldown — give the rest of the world time to find
# malicious releases before you pull them into your repos.
#
# Distributed by CrossCheck via scripts/install-dependabot-cooldown.sh
# Policy: docs/rules/trust-model.md § Supply Chain
#
# cooldown does NOT delay security advisories — GHSA-triggered updates fire
# immediately. It only delays version-bump PRs.

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 10
      semver-major-days: 20
      semver-minor-days: 10
      semver-patch-days: 7
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 10
      semver-major-days: 20
      semver-minor-days: 10
      semver-patch-days: 7
